<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* Exact-size render targets for headless screenshots. No margins, no
         scrollbars, one artboard per page via ?a= */
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
      }
      /* !important on purpose: the per-artboard rules below are ID selectors
         and would otherwise out-specify this and render every board at once. */
      .art:not(.on) {
        display: none !important;
      }
      #icon180 {
        width: 180px;
        height: 180px;
      }
      #icon512 {
        width: 512px;
        height: 512px;
      }
      /* Android maskable: the safe zone is the middle 80%, so the mark shrinks
         and the tile bleeds to the edges. */
      #maskable {
        width: 512px;
        height: 512px;
        background: #141210;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #maskable img {
        width: 358px;
        height: 358px;
      }
      #lockup {
        width: 1026px;
        height: 264px;
        background: #141210;
      }
      #lockup img {
        width: 1026px;
      }
      #og {
        width: 1200px;
        height: 630px;
        background: #141210;
        box-sizing: border-box;
        padding: 54px 64px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        font-family: 'Libre Franklin', system-ui, sans-serif;
        border: 10px solid #453c2d;
      }
      #og .kicker {
        color: #97907e;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      #og .mid {
        display: flex;
        align-items: center;
        gap: 34px;
      }
      #og .mid img {
        width: 150px;
        height: 150px;
      }
      #og .word img {
        width: 620px;
      }
      #og .line {
        color: #f2e8d5;
        font-size: 40px;
        font-weight: 700;
      }
      #og .foot {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
      }
      #og .url {
        color: #ffc72e;
        font-size: 28px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="art" id="icon180"><img src="logo-mark.svg" width="180" height="180" /></div>
    <div class="art" id="icon512"><img src="logo-mark.svg" width="512" height="512" /></div>
    <div class="art" id="maskable"><img src="logo-mark-mono-gold.svg" /></div>
    <div class="art" id="lockup"><img src="logo-lockup.svg" /></div>
    <div class="art" id="og">
      <div class="kicker">1v1 video debates · ai judge · six ranked bots</div>
      <div class="mid">
        <img src="logo-mark.svg" />
        <div class="word"><img src="logo-wordmark-only.svg" /></div>
      </div>
      <div class="foot">
        <span class="line">settle it on camera.</span>
        <span class="url">www.yapstage.com</span>
      </div>
    </div>
    <script>
      const which = new URLSearchParams(location.search).get('a');
      const el = document.getElementById(which);
      if (el) el.classList.add('on');
    </script>
  </body>
</html>
