<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Exact-size render targets for headless screenshots, one artboard per
         page via ?a= — see brand/build.cjs.

         Every board is sized in vw/vh and lays its contents out in PERCENTS,
         never pixels. A board pinned to 1024px renders as a top-left crop the
         moment you shoot it at 400px, which is exactly how the first avatar
         came out as an orange square in the corner. */
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
      }
      /* !important on purpose: the per-artboard rules below are ID selectors
         and would otherwise out-specify this and render every board at once. */
      .art:not(.on) {
        display: none !important;
      }
      .art {
        width: 100vw;
        height: 100vh;
        box-sizing: border-box;
      }
      .center {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .house {
        background: #16172b;
      }

      #icon img {
        width: 100%;
        height: 100%;
        display: block;
      }
      /* Android maskable: the safe zone is the middle 80%, so the mark shrinks
         and the tile bleeds to the edges. */
      #maskable img {
        width: 70%;
        height: 70%;
      }
      #lockup img {
        width: 88%;
      }
      /* Social avatar. Every platform crops a pfp to a CIRCLE, and the
         inscribed circle only covers 70.7% of a square, so the mark is set at
         60% width — inside the circle with room, instead of clipped at the
         quotes' outer edges. */
      #pfp img,
      #pfp-light img {
        width: 60%;
        height: 60%;
      }
      #pfp-light {
        background: #efe8d8;
      }
      /* X / LinkedIn header. Avatars and buttons eat the bottom corners on
         every platform, so the lockup sits dead centre and nothing else does. */
      #banner {
        position: relative;
        overflow: hidden;
      }
      #banner img.word {
        position: relative;
        width: 62%;
      }
      /* The link preview. No framed box and no gold: the house colour, the two
         stage lights the app actually uses, and the lockup. */
      #og {
        position: relative;
        overflow: hidden;
        padding: 9.8% 6%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        font-family: 'Libre Franklin', system-ui, sans-serif;
      }
      /* Blurred on purpose: a hard-edged gradient polygon reads as a brown
         triangle, not as a light. The blur is what makes it a beam. */
      .lights {
        position: absolute;
        inset: -8%;
        width: 116%;
        height: 116%;
        filter: blur(44px);
      }
      #og > *:not(.lights) {
        position: relative;
      }
      #og .kicker {
        color: #9a97b0;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      #og .mid img {
        width: 68%;
      }
      #og .foot {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
      }
      #og .line {
        color: #efe8d8;
        font-size: 40px;
        font-weight: 700;
      }
      #og .url {
        color: #f0821e;
        font-size: 28px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="art" id="icon"><img src="logo-mark.svg" /></div>
    <div class="art center house" id="maskable"><img src="logo-mark-plain.svg" /></div>
    <div class="art center house" id="lockup"><img src="logo-lockup-plain.svg" /></div>
    <div class="art center house" id="pfp"><img src="logo-mark-plain.svg" /></div>
    <div class="art center" id="pfp-light"><img src="logo-mark-plain.svg" /></div>
    <div class="art center house" id="banner">
      <svg class="lights" viewBox="0 0 1500 500" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="ba" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#F0821E" stop-opacity=".17" />
            <stop offset="0.7" stop-color="#F0821E" stop-opacity="0" />
          </linearGradient>
          <linearGradient id="bb" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1FC2D4" stop-opacity=".16" />
            <stop offset="0.7" stop-color="#1FC2D4" stop-opacity="0" />
          </linearGradient>
        </defs>
        <polygon points="330,-20 400,-20 500,520 190,520" fill="url(#ba)" />
        <polygon points="1110,-20 1180,-20 1330,520 990,520" fill="url(#bb)" />
      </svg>
      <img class="word" src="logo-lockup-plain.svg" />
    </div>
    <div class="art house" id="og">
      <svg class="lights" viewBox="0 0 1200 630" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="la" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#F0821E" stop-opacity=".17" />
            <stop offset="0.72" stop-color="#F0821E" stop-opacity="0" />
          </linearGradient>
          <linearGradient id="lb" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1FC2D4" stop-opacity=".16" />
            <stop offset="0.72" stop-color="#1FC2D4" stop-opacity="0" />
          </linearGradient>
        </defs>
        <polygon points="250,-20 320,-20 430,650 120,650" fill="url(#la)" />
        <polygon points="900,-20 970,-20 1120,650 780,650" fill="url(#lb)" />
      </svg>
      <div class="kicker">1v1 spoken debates · ai judge · eight ranked bots</div>
      <div class="mid"><img src="logo-lockup-plain.svg" /></div>
      <div class="foot">
        <span class="line">settle it out loud.</span>
        <span class="url">www.yapstage.com</span>
      </div>
    </div>
    <script>
      const which = new URLSearchParams(location.search).get('a');
      const el = document.getElementById(which);
      if (el) el.classList.add('on');
    </script>
  </body>
</html>
